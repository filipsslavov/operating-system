<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f2f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Habit Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f2f2;
  --surface:#eae9e9;
  --ink:#201e1d;
  --accent:#ec3013;
  --accent-700:#ae1800;
  --divider:rgba(32,30,29,.4);
  --divider-soft:rgba(32,30,29,.18);
  --dim:rgba(32,30,29,.55);
  --dimmer:rgba(32,30,29,.42);
  --nav:66px;
  --font:'Archivo',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:15px;line-height:1.5;overscroll-behavior-y:none;
}
button,input,textarea{font-family:var(--font)}
h1{margin:0;font-weight:800;letter-spacing:-.02em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::placeholder{color:rgba(32,30,29,.35)}

#root{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--bg)}
#onboarding{flex:1;display:flex;flex-direction:column;min-height:0}
#onboarding.hidden{display:none}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* ---------- onboarding ---------- */
.ob-body{padding:calc(env(safe-area-inset-top) + 26px) 20px 0;flex:1;display:flex;flex-direction:column}
.ob-eyebrow{font-size:10px;font-weight:700;letter-spacing:.2em;color:var(--dim)}
.ob-num{font-size:120px;font-weight:900;letter-spacing:-.06em;line-height:.86;margin-top:12px}
.ob-h1{font-size:32px;font-weight:800;letter-spacing:-.025em;line-height:1.08;margin:14px 0 0}
.ob-p{font-size:14.5px;line-height:1.55;color:var(--dim);margin:14px 0 0}
.ob-rule{margin-top:auto}
.ob-poster{background:var(--accent);color:var(--bg);padding:18px 20px}
.ob-poster .eyebrow{font-size:10px;font-weight:700;letter-spacing:.2em;opacity:.85}
.ob-poster .headline{font-size:24px;font-weight:900;letter-spacing:-.025em;line-height:1.15;margin-top:8px}
.wake-list{margin-top:22px;border-top:2px solid var(--divider)}
.wake-opt{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--divider-soft);cursor:pointer}
.wake-opt .box{flex:none;width:20px;height:20px;border:2px solid var(--dimmer)}
.wake-opt .v{flex:1;font-size:24px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.wake-opt .note{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--dimmer)}
.week1-list{margin-top:18px;border-top:2px solid var(--divider)}
.week1-row{display:flex;align-items:baseline;gap:14px;padding:15px 20px;border-bottom:1px solid var(--divider-soft)}
.week1-row:last-child{border-bottom:2px solid var(--divider)}
.week1-row .idx{flex:none;width:24px;font-size:13px;font-weight:800;color:var(--dimmer)}
.week1-row .t{font-size:19px;font-weight:700;letter-spacing:-.02em}
.week1-row .s{font-size:12.5px;color:var(--dim);margin-top:2px}
.ob-foot{flex:none;padding:16px 20px calc(env(safe-area-inset-bottom) + 18px);display:flex;gap:10px;border-top:2px solid var(--divider)}
.btn-back{flex:none;background:transparent;border:1px solid var(--divider);color:var(--ink);font-size:14px;font-weight:800;letter-spacing:.02em;padding:14px 18px;cursor:pointer}
.btn-next{flex:1;background:var(--accent);border:1px solid var(--accent);color:var(--bg);font-size:14px;font-weight:800;letter-spacing:.02em;padding:14px 18px;text-align:left;cursor:pointer}

/* ---------- today ---------- */
.t-eyebrow-row{padding:14px 20px 0;display:flex;justify-content:space-between;align-items:baseline}
.t-eyebrow{font-size:10px;font-weight:700;letter-spacing:.2em;color:var(--dim)}
.numeral{padding:2px 20px 0;display:flex;align-items:flex-end;gap:14px}
.numeral .n{font-size:104px;font-weight:900;letter-spacing:-.06em;line-height:.82}
.numeral .of{padding-bottom:14px}
.numeral .of .frac{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--dimmer)}
.numeral .of .lbl{font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--dim);margin-top:6px}
.dayline{padding:10px 20px 0;font-size:14px;line-height:1.45;color:var(--dim);max-width:330px}
.poster{background:var(--accent);color:var(--bg);padding:18px 20px}
.poster .eyebrow{font-size:10px;font-weight:700;letter-spacing:.2em;opacity:.85}
.poster .headline{font-size:28px;font-weight:900;letter-spacing:-.03em;line-height:1.08;margin-top:8px}
.poster .sub{font-size:13px;line-height:1.45;margin-top:7px;opacity:.9;max-width:310px}
.poster .meta{font-size:12px;letter-spacing:.1em;font-weight:700;margin-top:13px;opacity:.9}
.row-item{display:flex;align-items:baseline;gap:14px;padding:15px 20px;border-bottom:1px solid var(--divider-soft);cursor:pointer}
.row-item .idx{flex:none;width:24px;font-size:13px;font-weight:800;letter-spacing:.04em}
.row-item .lbl{flex:1;min-width:0}
.row-item .t{font-size:20px;font-weight:700;letter-spacing:-.02em;text-decoration-thickness:2px}
.row-item .s{font-size:12.5px;line-height:1.4;color:var(--dim);margin-top:2px}
.row-item .state{flex:none;font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--accent)}
.locked-hdr{padding:16px 20px 4px;font-size:10px;font-weight:700;letter-spacing:.2em;color:var(--dimmer)}
.locked-row{display:flex;align-items:baseline;gap:14px;padding:11px 20px;opacity:.42}
.locked-row .idx{flex:none;width:24px;font-size:13px;font-weight:800;color:var(--dimmer)}
.locked-row .t{flex:1;font-size:17px;font-weight:700;letter-spacing:-.02em}
.unlock-note{padding:6px 20px 16px;font-size:11.5px;font-weight:700;letter-spacing:.12em;color:var(--accent-700)}
.statgrid{border-top:2px solid var(--divider);display:grid;grid-template-columns:1fr 1fr 1fr}
.statgrid .cell{padding:16px 14px 18px;border-right:1px solid var(--divider-soft)}
.statgrid .cell:last-child{border-right:none}
.statgrid .v{font-size:40px;font-weight:900;letter-spacing:-.04em;line-height:1}
.statgrid .v.accent{color:var(--accent)}
.statgrid .v small{font-size:18px}
.statgrid .l{font-size:9.5px;font-weight:700;letter-spacing:.14em;color:var(--dim);margin-top:4px}
.footline{padding:14px 20px 24px;font-size:12.5px;line-height:1.5;color:var(--dim)}
.hr2{height:2px;background:var(--divider)}

/* ---------- plan ---------- */
.plan-title{font-size:40px;font-weight:900;letter-spacing:-.035em;line-height:1;margin:8px 20px 0}
.plan-row{border-bottom:1px solid var(--divider-soft)}
.plan-head{display:flex;align-items:baseline;gap:14px;padding:16px 20px;cursor:pointer}
.plan-head .idx{flex:none;width:24px;font-size:13px;font-weight:800;letter-spacing:.04em}
.plan-head .t{flex:1;font-size:22px;font-weight:800;letter-spacing:-.025em}
.plan-head .mark{flex:none;font-size:20px;font-weight:700;color:var(--dimmer);line-height:1}
.plan-body{padding:0 20px 18px 58px;font-size:13.5px;line-height:1.62;color:rgba(32,30,29,.68)}
.plan-refrow{display:flex;gap:12px;padding:8px 0;border-top:1px solid rgba(32,30,29,.15)}
.plan-refrow .k{flex:none;width:58px;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--accent-700);padding-top:2px}
.plan-refrow .v{font-weight:600;color:var(--ink)}
.plan-refrow .e{font-size:12.5px;color:var(--dim);margin-top:1px}
.plan-body-text{margin-top:12px}

/* ---------- log ---------- */
.ctr-row{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--divider-soft)}
.ctr-row .name{flex:1;min-width:0}
.ctr-row .name .n{font-size:18px;font-weight:700;letter-spacing:-.02em}
.ctr-row .name .g{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--dimmer);margin-top:2px}
.ctr-row .val{flex:none;font-size:38px;font-weight:900;letter-spacing:-.04em;line-height:1;min-width:56px;text-align:right}
.ctr-row .btns{flex:none;display:flex;gap:6px}
.ctr-row .btns button{width:44px;height:44px;font-size:20px;font-weight:700;line-height:1;cursor:pointer}
.btn-dec{background:transparent;border:1px solid var(--divider);color:var(--ink)}
.btn-inc{background:var(--ink);border:1px solid var(--ink);color:var(--bg)}
.section-lbl{padding:20px 20px 0;font-size:10px;font-weight:700;letter-spacing:.2em;color:var(--dim)}
.wt-row{display:flex;align-items:center;gap:12px;padding:10px 20px 16px;border-bottom:1px solid var(--divider-soft)}
.wt-row input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--divider);color:var(--ink);font-size:32px;font-weight:800;letter-spacing:-.03em;padding:12px 14px;border-radius:0}
.wt-row .u{flex:none;font-size:13px;font-weight:800;letter-spacing:.12em;color:var(--dim)}
.note{padding:12px 20px 0;font-size:12.5px;line-height:1.5;color:var(--dim)}
.tawrap{padding:10px 20px 0}
.tawrap textarea{width:100%;min-height:96px;background:var(--surface);border:1px solid var(--divider);color:var(--ink);font-size:14.5px;line-height:1.5;padding:13px;resize:vertical;border-radius:0}

/* ---------- review ---------- */
.rv-lost{padding:18px 20px 0;display:flex;align-items:flex-end;gap:12px}
.rv-lost .n{font-size:88px;font-weight:900;letter-spacing:-.05em;line-height:.85}
.rv-lost .unit{font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--dimmer)}
.rv-lost .lbl{font-size:9.5px;font-weight:700;letter-spacing:.14em;color:var(--dim);margin-top:4px}
.rv-trend{padding:8px 20px 0;font-size:12.5px;line-height:1.5;color:var(--dim)}
.rv-spark{padding:14px 20px 18px}
.rv-spark svg{width:100%;height:72px;overflow:visible;display:block}
.weekstat-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:13px 20px;border-bottom:1px solid var(--divider-soft)}
.weekstat-row .k{font-size:17px;font-weight:700;letter-spacing:-.02em}
.weekstat-row .v{font-size:20px;font-weight:900;letter-spacing:-.03em}
.btn-reset{width:100%;background:transparent;border:1px solid var(--divider);color:var(--ink);font-size:13.5px;font-weight:800;letter-spacing:.02em;padding:14px 16px;text-align:left;cursor:pointer;margin-top:0}

/* ---------- nav + pill ---------- */
nav{flex:none;border-top:2px solid var(--divider);display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg)}
nav button{background:none;border:none;padding:13px 0 11px;text-align:center;cursor:pointer;border-top:3px solid transparent;margin-top:-2px;font-family:var(--font);font-size:9.5px;font-weight:800;letter-spacing:.16em;color:var(--dim)}
nav button.sel{color:var(--accent);border-top-color:var(--accent)}
.homepill{flex:none;display:flex;justify-content:center;padding:7px 0 calc(env(safe-area-inset-bottom) + 8px)}
.homepill .bar{width:106px;height:4px}

/* ---------- unlock overlay ---------- */
.unlock-ov{position:fixed;inset:0;background:var(--accent);color:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 40px) 20px calc(env(safe-area-inset-bottom) + 20px);z-index:50;overflow-y:auto}
.unlock-ov .eyebrow{font-size:10px;font-weight:700;letter-spacing:.2em;opacity:.85}
.unlock-ov .num{font-size:min(160px,32vw);font-weight:900;letter-spacing:-.07em;line-height:.82;margin-top:10px}
.unlock-ov .headline{font-size:34px;font-weight:900;letter-spacing:-.03em;line-height:1.05;margin-top:14px}
.unlock-ov .sub{font-size:14.5px;line-height:1.5;margin-top:12px;opacity:.92;max-width:340px}
.unlock-ov .list{margin-top:22px;border-top:2px solid rgba(243,242,242,.5)}
.unlock-ov .item{display:flex;align-items:baseline;gap:14px;padding:12px 0;border-bottom:1px solid rgba(243,242,242,.35)}
.unlock-ov .item .idx{flex:none;width:24px;font-size:13px;font-weight:800;opacity:.7}
.unlock-ov .item .t{flex:1;font-size:20px;font-weight:700;letter-spacing:-.02em}
.btn-ack{margin-top:auto;width:100%;background:var(--bg);border:1px solid var(--bg);color:var(--ink);font-size:14px;font-weight:800;letter-spacing:.02em;padding:16px 18px;text-align:left;cursor:pointer}

.hidden{display:none}
</style>
</head>
<body>

<div id="root">
  <div id="onboarding"></div>
  <div id="app" class="hidden" style="flex:1;display:flex;flex-direction:column;min-height:0">
    <div class="scroll" id="tabContent"></div>
    <nav id="tabNav"></nav>
    <div class="homepill"><div class="bar"></div></div>
  </div>
  <div id="unlockOverlay"></div>
</div>

<script>
const KEY = 'habit-tracker-v1';
const RED = '#ec3013', INK = '#201e1d', DIM = 'rgba(32,30,29,.42)';

const LAYERS = [
  { n: 'Foundation', sub: 'A fixed wake time, the phone charging outside the bedroom, and twenty minutes of walking. That is the whole assignment.' },
  { n: 'Movement', sub: 'Foundation holds, and now the gym three times a week plus eight thousand steps a day. Food is still untouched.' },
  { n: 'Food', sub: 'Everything above, plus the four food rules. It is the heaviest lift, which is exactly why it is third and not first.' },
  { n: 'Full system', sub: 'Deep blocks, the job search cadence, and the project. You are running the whole thing now.' }
];

const ITEMS = [
  { id: 'wake', p: 0, t: 'Up at $WAKE', s: "Weekends close to it too — that's what keeps Monday easy." },
  { id: 'phone', p: 0, t: 'Phone in the kitchen', s: 'Not the nightstand. Distance does the work for you.' },
  { id: 'walk', p: 0, t: '20-minute walk', s: 'Outside, any time. It counts even if it is slow.' },
  { id: 'steps', p: 1, t: '8,000 steps', s: 'The real lever on a day spent sitting down.' },
  { id: 'gym', p: 1, t: 'Gym — A or B', s: 'Mon, Wed, Fri. Three sets of eight to twelve.', wk: [1, 3, 5] },
  { id: 'prot', p: 2, t: 'Protein each meal', s: 'Forty grams or so. Ordering out? Take the grilled one.' },
  { id: 'liq', p: 2, t: 'No liquid calories', s: 'Weekdays. Weekends are budgeted, not banned.' },
  { id: 'sit', p: 2, t: 'Eat sitting down', s: 'On a plate, at a table — nothing standing at the counter.' },
  { id: 'd1', p: 3, t: 'Deep Block 1 — project', s: '08:00–10:00. Phone in another room.' },
  { id: 'job', p: 3, t: 'Job search block', s: '10:30–12:00. Follow the weekly cadence.' },
  { id: 'd2', p: 3, t: 'Deep Block 2 — flex', s: '14:30–16:00. Prep, drills, follow-ups.' }
];

const SCHED = [
  [405, 435, 'No phone', 'Water, coffee, and step outside for a minute.'],
  [435, 480, 'Breakfast', 'Pick the one priority for the day while you eat.'],
  [480, 600, 'Deep Block 1', 'Project work — your sharpest hours, hardest thinking.'],
  [600, 630, 'Walk', 'Outside. It counts toward your steps.'],
  [630, 720, 'Job search', 'Applications, tailoring, outreach.'],
  [720, 780, 'Lunch', 'And actually decompress — that is the point of it.'],
  [780, 870, 'Gym or walk', 'A/B on Monday, Wednesday, Friday.'],
  [870, 960, 'Deep Block 2', 'Interview prep, drills, follow-ups.'],
  [960, 1290, 'Free', 'Genuinely free, no guilt. This is the trade.'],
  [1290, 1350, 'Phone to the kitchen', 'Hard stop for the day.'],
  [1350, 1440, 'Wind down', 'Bed by eleven.']
];

const PLAN = [
  { id: 'ramp', t: 'The ramp', rows: [
      { k: 'WEEK 1', v: 'Foundation', e: 'Fixed wake · phone out of the bedroom · 20 min walk' },
      { k: 'WEEK 2', v: 'Movement', e: 'Gym 3× · 8,000 steps daily' },
      { k: 'WEEK 3', v: 'Food', e: 'The four rules' },
      { k: 'WEEK 4', v: 'Full system', e: 'Deep blocks · job search cadence · project' }
    ], body: 'One layer a week, and a layer only opens once the current one held five days of seven. Weeks repeat when they need to — nothing is lost. Compressing this is the single most likely reason the whole thing comes apart.' },
  { id: 'day', t: 'The weekday', rows: [], body: 'Roughly five and a half focused hours, which is a full day of real output because none of it is meetings. The blocks are on the Today tab as the day moves through them.' },
  { id: 'food', t: 'Four food rules', rows: [
      { k: 'ONE', v: 'Protein anchor', e: '40g+ per meal, 150–180g a day. It is what makes a deficit survivable.' },
      { k: 'TWO', v: 'Three zero-effort defaults', e: 'Yogurt + berries · rotisserie chicken + bagged salad · eggs + turkey sausage.' },
      { k: 'THREE', v: 'No liquid calories Mon–Fri', e: 'Coffee black or a splash. Several hundred easy calories.' },
      { k: 'FOUR', v: 'Relocate the snacking', e: 'On a plate, sitting down. Inventory, not willpower.' }
    ], body: 'Target is bodyweight × 10 calories, recalculated every fifteen pounds. Track for three weeks to calibrate your eye, then run on the rules instead of the app.' },
  { id: 'gym', t: 'Gym — A / B', rows: [
      { k: 'A', v: 'Goblet squat · DB bench · cable row · plank', e: '3 × 8–12, plank 3 × 30–45 sec' },
      { k: 'B', v: 'RDL · lat pulldown · shoulder press · split squat', e: '3 × 8–12' }
    ], body: 'Three times a week, forty-five minutes. Hit twelve on all three sets and add weight next time — that progression is the entire program. No new exercises until month three; variety is how gym programs die.' },
  { id: 'job', t: 'Job search', rows: [
      { k: 'MON', v: 'Source 10 target roles', e: '' },
      { k: 'TUE', v: '3 tailored applications', e: '' },
      { k: 'WED', v: '5 outreach messages', e: 'People at target companies, not recruiters' },
      { k: 'THU', v: '3 tailored applications', e: '' },
      { k: 'FRI', v: 'Follow-ups · what is getting replies', e: '' }
    ], body: 'Six tailored applications beat forty sprayed. Wednesday is the day people skip and the day that works — twenty warm messages a month, and you need one of them to land.' },
  { id: 'proj', t: 'The project', rows: [
      { k: 'WK 1–2', v: 'Scope locked in writing · data sourced', e: '' },
      { k: 'WK 3–6', v: 'Pipeline end to end — ugly but working', e: '' },
      { k: 'WK 7–9', v: 'Analysis or model layer', e: '' },
      { k: 'WK 10–11', v: 'Dashboard + written narrative', e: '' },
      { k: 'WK 12', v: 'Publish. Whatever state it is in.', e: '' }
    ], body: 'One project at a time with a ship date. Every new idea goes to the parking lot instead of getting started. Ship it ugly — one finished thing beats four abandoned perfect ones, and the finished one is what you talk about in interviews. Friday you show someone what moved.' },
  { id: 'phone', t: 'The phone', rows: [], body: 'Charger lives in the kitchen; buy a cheap alarm clock. Social and news off the home screen — one folder, second page. Different room during deep blocks, not face-down on the desk. One scheduled forty-five minute scroll window in the evening: bans fail, appointments hold.' },
  { id: 'track', t: 'On track looks like', rows: [
      { k: 'MONTH 1', v: 'Wake time automatic · gym is habit · down 4–6 lbs', e: '' },
      { k: 'MONTH 3', v: 'Down 15–18 lbs · pipeline works · real conversations', e: '' },
      { k: 'MONTH 6', v: 'Down 28–32 lbs · project published', e: '' },
      { k: 'MONTH 12', v: '50 lbs down · employed · proof you finish things', e: '' }
    ], body: '' }
];

const COUNTERS = [
  { id: 'stepk', n: 'Steps', g: '8,000 DAILY FLOOR', goal: 8, unit: 'k', p: 1 },
  { id: 'apps', n: 'Applications', g: 'TUE & THU — 3 EACH', goal: 3, unit: '', p: 3 },
  { id: 'out', n: 'Outreach', g: 'WED — 5 MESSAGES', goal: 5, unit: '', p: 3 },
  { id: 'proj', n: 'Project hours', g: '10 PER WEEK', goal: 2, unit: '', p: 3 }
];

const iso = d => d.toISOString().slice(0, 10);
const pad = n => String(n).padStart(2, '0');
const todayKey = () => iso(new Date());

function freshState() {
  return {
    screen: 'onboarding', step: 1, tab: 'today', wake: '6:45',
    weekStart: todayKey(), weekNo: 1, phase: 0, days: {},
    weight: '', parking: '', review: '', openPlan: 'ramp', unlock: 0
  };
}

let S = null;

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return Object.assign(freshState(), JSON.parse(raw));
  } catch (e) {}
  return freshState();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}

function rollWeek() {
  let changed = false;
  while (true) {
    const start = new Date(S.weekStart + 'T00:00:00');
    const next = new Date(start); next.setDate(start.getDate() + 7);
    if (new Date(todayKey() + 'T00:00:00') >= next) { S.weekStart = iso(next); S.weekNo += 1; changed = true; }
    else break;
  }
  return changed;
}

function weekDates() {
  const a = new Date(S.weekStart + 'T00:00:00');
  return Array.from({ length: 7 }, (_, i) => { const d = new Date(a); d.setDate(a.getDate() + i); return iso(d); });
}

function dayRec(k) { k = k || todayKey(); return S.days[k] || { c: {}, n: {} }; }

function visibleItems() {
  const dow = new Date().getDay();
  return ITEMS.filter(i => i.p <= S.phase && (!i.wk || i.wk.includes(dow)));
}

function heldCount() {
  return weekDates().filter(k => {
    if (!S.days[k]) return false;
    const dow = new Date(k + 'T00:00:00').getDay();
    const req = ITEMS.filter(i => i.p <= S.phase && (!i.wk || i.wk.includes(dow)));
    return req.length > 0 && req.every(i => S.days[k].c[i.id]);
  }).length;
}

function weightHistory() {
  return Object.entries(S.days).filter(([, v]) => v.w != null).sort(([a], [b]) => a < b ? -1 : 1).map(([, v]) => v.w);
}

/* ================= render ================= */

function render() {
  document.getElementById('onboarding').classList.toggle('hidden', S.screen !== 'onboarding');
  document.getElementById('app').classList.toggle('hidden', S.screen !== 'app');
  if (S.screen === 'onboarding') renderOnboarding();
  else renderApp();
  renderUnlock();
}

function renderOnboarding() {
  const ob = document.getElementById('onboarding');
  let body = '';
  if (S.step === 1) {
    body = `
      <div class="ob-body">
        <div class="ob-eyebrow">SETUP · 01 / 03</div>
        <div class="ob-num">01</div>
        <h1 class="ob-h1">One layer at a&nbsp;time.</h1>
        <p class="ob-p">Four layers, one a week. A layer only opens when the one below it held five days out of seven — so nothing stacks on a foundation that isn't there yet.</p>
        <p class="ob-p">Weeks can repeat. That isn't failure, it's the system doing its job.</p>
        <div class="ob-rule">
          <div class="hr2"></div>
          <div class="ob-poster">
            <div class="eyebrow">THE ONLY RULE THAT MATTERS</div>
            <div class="headline">Don't compress the ramp.</div>
          </div>
        </div>
      </div>`;
  } else if (S.step === 2) {
    const opts = ['6:00', '6:30', '6:45', '7:00'].map(v => {
      const on = S.wake === v;
      return `<div class="wake-opt" data-wake="${v}" style="background:${on ? 'rgba(236,48,19,.06)' : 'transparent'}">
        <div class="box" style="border-color:${on ? RED : 'rgba(32,30,29,.45)'};background:${on ? RED : 'transparent'}"></div>
        <div class="v">${v}</div>
        <div class="note">${v === '6:45' ? 'RECOMMENDED' : ''}</div>
      </div>`;
    }).join('');
    body = `
      <div class="ob-body">
        <div class="ob-eyebrow">SETUP · 02 / 03</div>
        <div class="ob-num">02</div>
        <h1 class="ob-h1">Pick your wake&nbsp;time.</h1>
        <p class="ob-p">Everything downstream hangs off this one. Pick the earliest time you'd still choose on a bad night.</p>
        <div class="wake-list" id="wakeList">${opts}</div>
      </div>`;
  } else {
    body = `
      <div class="ob-body">
        <div class="ob-eyebrow">SETUP · 03 / 03</div>
        <div class="ob-num">03</div>
        <h1 class="ob-h1">Week one is three&nbsp;things.</h1>
        <div class="week1-list">
          ${ITEMS.slice(0, 3).map((i, ix) => `
            <div class="week1-row"><div class="idx">${pad(ix + 1)}</div>
              <div><div class="t">${i.t.replace('$WAKE', S.wake)}</div><div class="s">${i.s}</div></div>
            </div>`).join('')}
        </div>
        <p class="ob-p">That's the whole assignment for seven days. No gym, no food rules, no project. Those arrive on their own.</p>
      </div>`;
  }
  const nextLabel = S.step >= 3 ? 'Start week one' : 'Continue';
  ob.innerHTML = `${body}
    <div class="ob-foot">
      <button class="btn-back" id="obBack" style="opacity:${S.step > 1 ? 1 : .35}">Back</button>
      <button class="btn-next" id="obNext">${nextLabel}</button>
    </div>`;

  if (S.step === 2) {
    document.getElementById('wakeList').addEventListener('click', e => {
      const el = e.target.closest('[data-wake]'); if (!el) return;
      S.wake = el.dataset.wake; save(); render();
    });
  }
  document.getElementById('obBack').addEventListener('click', () => {
    if (S.step > 1) { S.step -= 1; save(); render(); }
  });
  document.getElementById('obNext').addEventListener('click', () => {
    if (S.step >= 3) {
      S.screen = 'app'; S.step = 1; S.weekStart = todayKey(); S.weekNo = 1;
      save(); render();
    } else { S.step += 1; save(); render(); }
  });
}

function fmtT(v) { return pad(Math.floor(v / 60)) + ':' + pad(v % 60); }

function renderToday() {
  const now = new Date();
  const rec = dayRec();
  const vis = visibleItems();
  const done = vis.filter(i => rec.c[i.id]).length;
  const held = heldCount();

  const items = vis.map((i, ix) => {
    const on = !!rec.c[i.id];
    return { id: i.id, n: pad(ix + 1), t: i.t.replace('$WAKE', S.wake), s: i.s, on };
  });

  const nextP = S.phase + 1;
  const locked = nextP <= 3 ? ITEMS.filter(i => i.p === nextP).map((i, ix) => ({ n: pad(vis.length + ix + 1), t: i.t })) : [];

  const m = now.getHours() * 60 + now.getMinutes();
  const wknd = [0, 6].includes(now.getDay());
  const bi = SCHED.findIndex(b => m >= b[0] && m < b[1]);
  let nowKicker, nowTitle, nowSub, nowMeta;
  if (wknd) {
    nowKicker = 'RIGHT NOW · WEEKEND'; nowTitle = 'Off the clock';
    nowSub = 'Wake within an hour of ' + S.wake + ', take one long walk, and otherwise leave it alone. Sunday at four is the review.';
    nowMeta = 'NOTHING IS DUE TODAY';
  } else if (bi < 0) {
    nowKicker = 'RIGHT NOW'; nowTitle = 'Asleep, ideally';
    nowSub = 'The day starts at ' + S.wake + '. Nothing is expected of you before then.';
    nowMeta = 'NEXT · 06:45 · NO PHONE';
  } else {
    const b = SCHED[bi], nx = SCHED[bi + 1];
    nowKicker = 'RIGHT NOW · ' + fmtT(b[0]) + '–' + fmtT(b[1]);
    nowTitle = b[2]; nowSub = b[3];
    nowMeta = (b[1] - m) + ' MIN LEFT' + (nx ? '  ·  NEXT ' + fmtT(nx[0]) + ' ' + nx[2].toUpperCase() : '');
  }

  const warm = done >= vis.length && vis.length
    ? 'Full day held. That is exactly what this week is supposed to look like.'
    : done >= Math.ceil(vis.length * 0.6) ? 'Most of the day is already behind you. What is left is small on purpose.'
    : done >= 1 ? 'Started, which was the hard part. The rest of the list is short.'
    : 'Nothing yet, and that is fine. Pick the walk — it makes the others easier.';

  const w = weightHistory();
  const lost = w.length ? (w[0] - w[w.length - 1]).toFixed(1).replace(/\.0$/, '') : '0';

  const footLine = S.phase >= 3
    ? 'All four layers are installed. From here the only job is holding the line and shipping the project.'
    : held >= 5 ? 'Five held. Layer ' + (S.phase + 2) + ' opens Monday — nothing else to do this week.'
    : 'Five held days opens the next layer. There are still ' + (7 - held) + ' days in the week to get there.';

  return `
    <div class="t-eyebrow-row">
      <div class="t-eyebrow">${now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }).toUpperCase()}</div>
      <div class="t-eyebrow">WEEK ${S.weekNo} / LAYER ${S.phase + 1}</div>
    </div>
    <div class="numeral"><div class="n">${done}</div><div class="of"><div class="frac">/${vis.length}</div><div class="lbl">DONE TODAY</div></div></div>
    <div class="dayline">${warm}</div>
    <div class="hr2" style="margin-top:18px"></div>
    <div class="poster">
      <div class="eyebrow">${nowKicker}</div>
      <div class="headline">${nowTitle}</div>
      <div class="sub">${nowSub}</div>
      <div class="meta">${nowMeta}</div>
    </div>
    <div class="hr2"></div>
    <div id="todayItems">
      ${items.map(it => `
        <div class="row-item" data-ck="${it.id}">
          <div class="idx" style="color:${it.on ? RED : 'rgba(32,30,29,.38)'}">${it.n}</div>
          <div class="lbl"><div class="t" style="color:${it.on ? DIM : INK};text-decoration:${it.on ? '2px line-through ' + RED : 'none'}">${it.t}</div>
          <div class="s">${it.s}</div></div>
          <div class="state">${it.on ? 'DONE' : ''}</div>
        </div>`).join('')}
    </div>
    ${locked.length ? `
    <div style="border-top:1px solid var(--divider-soft)">
      <div class="locked-hdr">NEXT LAYER · ${LAYERS[nextP].n.toUpperCase()}</div>
      ${locked.map(lk => `<div class="locked-row"><div class="idx">${lk.n}</div><div class="t">${lk.t}</div></div>`).join('')}
      <div class="unlock-note">${held >= 5 ? 'UNLOCKED — STARTS MONDAY' : (5 - held) + ' MORE HELD DAY' + (5 - held === 1 ? '' : 'S') + ' OPENS THIS'}</div>
    </div>` : ''}
    <div class="statgrid">
      <div class="cell"><div class="v">${held}</div><div class="l">DAYS HELD</div></div>
      <div class="cell"><div class="v accent">${rec.n.stepk || 0}<small>k</small></div><div class="l">STEPS</div></div>
      <div class="cell"><div class="v">${lost}<small>lb</small></div><div class="l">SO FAR</div></div>
    </div>
    <div class="hr2"></div>
    <div class="footline">${footLine}</div>`;
}

function renderPlan() {
  const now = new Date();
  const rows = PLAN.map((p, ix) => {
    const open = S.openPlan === p.id;
    return `<div class="plan-row">
      <div class="plan-head" data-plan="${p.id}">
        <div class="idx" style="color:${open ? RED : 'rgba(32,30,29,.38)'}">${pad(ix + 1)}</div>
        <div class="t" style="color:${open ? INK : 'rgba(32,30,29,.72)'}">${p.t}</div>
        <div class="mark">${open ? '–' : '+'}</div>
      </div>
      ${open ? `<div class="plan-body">
        ${p.rows.map(r => `<div class="plan-refrow"><div class="k">${r.k}</div><div><div class="v">${r.v}</div>${r.e ? `<div class="e">${r.e}</div>` : ''}</div></div>`).join('')}
        ${p.body ? `<div class="plan-body-text">${p.body}</div>` : ''}
      </div>` : ''}
    </div>`;
  }).join('');
  return `
    <div class="t-eyebrow-row" style="justify-content:flex-start"><div class="t-eyebrow">REFERENCE · READ ONCE, THEN IGNORE</div></div>
    <h1 class="plan-title">The plan</h1>
    <div class="hr2" style="margin-top:16px"></div>
    <div id="planRows">${rows}</div>
    <div class="footline">None of this needs re-reading. The Today tab already knows what week you're in.</div>`;
}

function renderLog() {
  const now = new Date();
  const rec = dayRec();
  const counters = COUNTERS.filter(c => c.p <= S.phase).map(c => {
    const v = rec.n[c.id] || 0;
    return { ...c, v, on: v >= c.goal };
  });
  return `
    <div class="t-eyebrow-row" style="justify-content:flex-start"><div class="t-eyebrow">${now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }).toUpperCase()}</div></div>
    <h1 class="plan-title">Log</h1>
    <div class="hr2" style="margin-top:16px"></div>
    <div id="ctrRows">
      ${counters.map(c => `
        <div class="ctr-row">
          <div class="name"><div class="n">${c.n}</div><div class="g">${c.g}</div></div>
          <div class="val" style="color:${c.on ? RED : INK}">${c.v}${c.unit}</div>
          <div class="btns"><button class="btn-dec" data-dec="${c.id}">−</button><button class="btn-inc" data-inc="${c.id}">+</button></div>
        </div>`).join('')}
    </div>
    <div class="section-lbl">WEIGH-IN</div>
    <div class="wt-row">
      <input type="number" id="wtInput" step="0.1" inputmode="decimal" placeholder="—" value="${rec.w != null ? rec.w : ''}">
      <div class="u">LBS</div>
    </div>
    <div class="note">Once a week, same day, same conditions. Daily weight is mostly noise and it'll mess with your head.</div>
    <div class="section-lbl">PARKING LOT</div>
    <div class="tawrap"><textarea id="parkingInput" placeholder="New idea that grabbed you? Park it here.">${S.parking || ''}</textarea></div>
    <div class="footline">Every shiny new thing goes here instead of becoming a project. You get to open this list on week 12.</div>`;
}

function renderReview() {
  const w = weightHistory();
  const first = w.length ? w[0] : null, cur = w.length ? w[w.length - 1] : null;
  const lost = w.length ? (first - cur).toFixed(1).replace(/\.0$/, '') : '0';
  const trendLine = w.length
    ? 'Now ' + cur + ' lbs · ' + Math.max(0, (cur - (first - 50)).toFixed(0)) + ' to go · ' + w.length + ' weigh-in' + (w.length > 1 ? 's' : '') + ' logged'
    : 'Log your first weigh-in on the Log tab and the trend starts here.';
  let spark = '';
  if (w.length > 1) {
    const mn = Math.min(...w), mx = Math.max(...w), r = (mx - mn) || 1;
    const pts = w.map((v, i) => `${(i / (w.length - 1)) * 100},${42 - ((v - mn) / r) * 40}`).join(' ');
    spark = `<div class="rv-spark"><svg viewBox="0 0 100 44" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${RED}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"></polyline></svg></div>`;
  }

  const wk = weekDates();
  const wkRecs = wk.map(k => S.days[k]).filter(Boolean);
  const sum = k => wkRecs.reduce((a, d) => a + ((d.n && d.n[k]) || 0), 0);
  const held = heldCount();
  const clamp = (v, max) => Math.min(v, max);
  const weekStats = [
    { k: 'Days held', v: clamp(held, 7) + ' / 7', c: held >= 5 ? RED : INK },
    { k: 'Gym sessions', v: clamp(wkRecs.filter(d => d.c && d.c.gym).length, 3) + ' / 3', c: INK },
    { k: 'Steps average', v: (wkRecs.length ? Math.round(sum('stepk') / wkRecs.length) : 0) + 'k', c: INK },
    { k: 'Applications', v: clamp(sum('apps'), 6) + ' / 6', c: INK },
    { k: 'Project hours', v: clamp(sum('proj'), 10) + ' / 10', c: INK }
  ];

  return `
    <div class="t-eyebrow-row" style="justify-content:flex-start"><div class="t-eyebrow">SUNDAY · THIRTY MINUTES</div></div>
    <h1 class="plan-title">Review</h1>
    <div class="hr2" style="margin-top:16px"></div>
    <div class="rv-lost"><div class="n">${lost}</div><div><div class="unit">lbs</div><div class="lbl">DOWN SO FAR</div></div></div>
    <div class="rv-trend">${trendLine}</div>
    ${spark}
    <div class="hr2"></div>
    <div id="weekStats">${weekStats.map(w2 => `<div class="weekstat-row"><div class="k">${w2.k}</div><div class="v" style="color:${w2.c}">${w2.v}</div></div>`).join('')}</div>
    <div class="section-lbl">THE ONE THING THAT CHANGES</div>
    <div class="tawrap"><textarea id="reviewInput" placeholder="What worked, what didn't, and the one change for next week.">${S.review || ''}</textarea></div>
    <div class="note">One thing, not five. A rough week is data for this page — not grounds for quitting.</div>
    <div class="tawrap" style="padding-top:8px"><button class="btn-reset" id="resetBtn">Restart the ramp from today</button></div>`;
}

function renderApp() {
  rollWeek();
  const content = document.getElementById('tabContent');
  if (S.tab === 'today') content.innerHTML = renderToday();
  else if (S.tab === 'plan') content.innerHTML = renderPlan();
  else if (S.tab === 'log') content.innerHTML = renderLog();
  else content.innerHTML = renderReview();

  const nav = document.getElementById('tabNav');
  nav.innerHTML = [['today', 'TODAY'], ['plan', 'PLAN'], ['log', 'LOG'], ['review', 'REVIEW']]
    .map(([id, label]) => `<button data-tab="${id}" class="${S.tab === id ? 'sel' : ''}">${label}</button>`).join('');

  wireApp();
}

function wireApp() {
  const nav = document.getElementById('tabNav');
  nav.onclick = e => {
    const el = e.target.closest('[data-tab]'); if (!el) return;
    S.tab = el.dataset.tab; save(); renderApp();
    document.getElementById('tabContent').scrollTop = 0;
  };

  if (S.tab === 'today') {
    document.getElementById('todayItems').onclick = e => {
      const el = e.target.closest('[data-ck]'); if (!el) return;
      const k = el.dataset.ck, tk = todayKey();
      const rec = { c: { ...(S.days[tk] ? S.days[tk].c : {}) }, n: { ...(S.days[tk] ? S.days[tk].n : {}) }, w: S.days[tk] ? S.days[tk].w : undefined };
      rec.c[k] = !rec.c[k];
      if (k === 'steps') rec.n.stepk = rec.c.steps ? Math.max(8, rec.n.stepk || 0) : Math.min(7, rec.n.stepk || 0);
      const before = heldCount();
      S.days[tk] = rec;
      const after = heldCount();
      const crossed = after >= 5 && before < 5 && S.phase < 3;
      if (crossed) S.unlock = S.phase + 1;
      save(); render();
    };
  }

  if (S.tab === 'plan') {
    document.getElementById('planRows').onclick = e => {
      const el = e.target.closest('[data-plan]'); if (!el) return;
      S.openPlan = S.openPlan === el.dataset.plan ? '' : el.dataset.plan;
      save(); renderApp();
    };
  }

  if (S.tab === 'log') {
    document.getElementById('ctrRows').onclick = e => {
      const inc = e.target.closest('[data-inc]'), dec = e.target.closest('[data-dec]');
      if (!inc && !dec) return;
      const id = (inc || dec).dataset[inc ? 'inc' : 'dec'], tk = todayKey();
      const rec = { c: { ...(S.days[tk] ? S.days[tk].c : {}) }, n: { ...(S.days[tk] ? S.days[tk].n : {}) }, w: S.days[tk] ? S.days[tk].w : undefined };
      rec.n[id] = Math.max(0, (rec.n[id] || 0) + (inc ? 1 : -1));
      if (id === 'stepk') rec.c.steps = rec.n[id] >= 8;
      S.days[tk] = rec;
      save(); renderApp();
    };
    document.getElementById('wtInput').addEventListener('change', e => {
      const v = parseFloat(e.target.value);
      const tk = todayKey();
      const rec = { c: { ...(S.days[tk] ? S.days[tk].c : {}) }, n: { ...(S.days[tk] ? S.days[tk].n : {}) } };
      rec.w = isNaN(v) ? undefined : v;
      S.days[tk] = rec;
      save();
    });
    document.getElementById('parkingInput').addEventListener('input', e => { S.parking = e.target.value; save(); });
  }

  if (S.tab === 'review') {
    document.getElementById('reviewInput').addEventListener('input', e => { S.review = e.target.value; save(); });
    document.getElementById('resetBtn').addEventListener('click', () => {
      if (confirm('Restart the ramp from today? Your weight history and notes stay.')) {
        S.screen = 'onboarding'; S.step = 1; S.phase = 0; S.days = {};
        S.weekNo = 1; S.weekStart = todayKey(); S.tab = 'today';
        save(); render();
      }
    });
  }
}

function renderUnlock() {
  const ov = document.getElementById('unlockOverlay');
  if (!S.unlock) { ov.innerHTML = ''; return; }
  const layer = S.unlock;
  const newItems = ITEMS.filter(i => i.p === layer).map((i, ix) => ({ n: pad(ix + 1), t: i.t.replace('$WAKE', S.wake) }));
  ov.innerHTML = `
    <div class="unlock-ov">
      <div class="eyebrow">FIVE OF SEVEN HELD</div>
      <div class="num">${pad(layer + 1)}</div>
      <div class="headline">Layer ${layer + 1} — ${LAYERS[layer].n} is&nbsp;open.</div>
      <div class="sub">${LAYERS[layer].sub}</div>
      <div class="list">
        ${newItems.map(ni => `<div class="item"><div class="idx">${ni.n}</div><div class="t">${ni.t}</div></div>`).join('')}
      </div>
      <button class="btn-ack" id="ackBtn">Install it — starts Monday</button>
    </div>`;
  document.getElementById('ackBtn').addEventListener('click', () => {
    S.phase = S.unlock; S.unlock = 0; save(); render();
  });
}

/* ---------------- boot ---------------- */
S = load();
save();
render();
setInterval(() => { if (S.screen === 'app' && S.tab === 'today') renderApp(); }, 60000);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
